name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # required to create/upload the GitHub Release

jobs:
  release:
    name: Build ${{ matrix.label }} bundle (Tauri)
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            platform: windows-latest
            backend_executable: dist/nemoris-backend/nemoris-backend.exe
            tauri_args: ""
          - label: Linux
            platform: ubuntu-22.04
            backend_executable: dist/nemoris-backend/nemoris-backend
            tauri_args: "--bundles appimage"
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget \
            xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # The FastAPI backend ships as a PyInstaller onedir resource. Avoiding
      # onefile prevents a large temporary extraction on every app launch.
      # No questions.db is bundled: a fresh install starts empty and users
      # pull content from the pack catalogue.
      - name: Build backend sidecar
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --name nemoris-backend --onedir --clean --noconfirm --collect-data countryinfo run_sidecar.py

      - name: Smoke-test backend sidecar
        working-directory: backend
        run: python tools/smoke_sidecar.py "${{ matrix.backend_executable }}"

      # The updater compares this against the installed app's version, so a
      # forgotten manual bump here would silently break update detection
      # (not just mislabel a filename, as it did before this was added).
      - name: Sync app version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node <<'NODE'
          const fs = require("fs");
          const path = "frontend/src-tauri/tauri.conf.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          data.version = process.env.VERSION;
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      # tauri-action runs the beforeBuildCommand (npm run build) then bundles
      # the Windows installer(s) or Linux AppImage and uploads them to the
      # tag's release, along with the signed latest.json the updater plugin
      # polls.
      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Nemoris ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: ${{ matrix.tauri_args }}
