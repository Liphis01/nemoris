name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # required to create/upload the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  label: linux,   sep: ":", archive: QuizApp-linux.tar.gz }
          - { os: windows-latest, label: windows, sep: ";", archive: QuizApp-windows.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Seed a fresh database
        working-directory: backend
        run: |
          python -c "from app.bootstrap import init_database; init_database()"  # build + stamp schema via migrations
          python import_csv.py                                                  # populate from the tracked questions.csv

      - name: Build executable (PyInstaller)
        working-directory: backend
        run: >
          pyinstaller --name QuizApp --onedir --noconfirm
          --add-data "../frontend/dist${{ matrix.sep }}frontend/dist"
          run_desktop.py

      - name: Stage app data
        working-directory: backend
        shell: bash
        run: |
          cp questions.db dist/QuizApp/questions.db
          mkdir -p dist/QuizApp/static
          [ -d static ] && cp -R static/. dist/QuizApp/static/ || true

      - name: Archive (linux)
        if: matrix.label == 'linux'
        working-directory: backend/dist
        run: tar -czf ${{ matrix.archive }} QuizApp

      - name: Archive (windows)
        if: matrix.label == 'windows'
        working-directory: backend/dist
        run: Compress-Archive -Path QuizApp -DestinationPath ${{ matrix.archive }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/${{ matrix.archive }}
