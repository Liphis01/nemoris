name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # required to create/upload the GitHub Release

jobs:
  release:
    name: Build Windows installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # The FastAPI backend ships as a single-file console binary that Tauri
      # spawns as a sidecar. questions.db is seeded from the tracked CSV and
      # bundled so the app has data on first run.
      - name: Build backend sidecar
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python -c "from app.bootstrap import init_database; init_database()"
          python import_csv.py
          pyinstaller --name nemoris-backend --onefile --noconfirm --add-data "questions.db;seed" --collect-data countryinfo run_sidecar.py

      # Tauri resolves externalBin by target triple; place the built binary
      # where tauri.conf.json's "binaries/nemoris-backend" expects it.
      - name: Place sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp backend/dist/nemoris-backend.exe \
            "frontend/src-tauri/binaries/nemoris-backend-x86_64-pc-windows-msvc.exe"

      # The updater compares this against the installed app's version, so a
      # forgotten manual bump here would silently break update detection
      # (not just mislabel a filename, as it did before this was added).
      - name: Sync app version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' frontend/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json frontend/src-tauri/tauri.conf.json

      # tauri-action runs the beforeBuildCommand (npm run build) then bundles
      # the NSIS installer + MSI and uploads them to the tag's release, along
      # with the signed latest.json the updater plugin polls.
      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Nemoris ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
