name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # required to create/upload the GitHub Release

jobs:
  release:
    name: Build Windows installer (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # The FastAPI backend ships as a PyInstaller onedir resource. Avoiding
      # onefile prevents a large temporary extraction on every app launch.
      # No questions.db is bundled: a fresh install starts empty and users
      # pull content from the pack catalogue.
      - name: Build backend sidecar
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --name nemoris-backend --onedir --clean --noconfirm --collect-data countryinfo run_sidecar.py

      - name: Smoke-test backend sidecar
        shell: pwsh
        working-directory: backend
        run: |
          $backend = Resolve-Path "dist/nemoris-backend/nemoris-backend.exe"
          if (-not (Test-Path "dist/nemoris-backend/_internal" -PathType Container)) {
            throw "PyInstaller onedir support directory is missing."
          }

          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()

          $smokeData = Join-Path $env:RUNNER_TEMP "nemoris-sidecar-smoke"
          New-Item -ItemType Directory -Force -Path $smokeData | Out-Null
          $env:APPDATA = $smokeData
          $env:QUIZ_APP_PORT = "$port"
          $startedAt = [System.Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $backend -PassThru -NoNewWindow

          try {
            $ready = $false
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while ([DateTime]::UtcNow -lt $deadline -and -not $ready) {
              if ($process.HasExited) {
                throw "Backend exited before becoming ready (code $($process.ExitCode))."
              }
              try {
                $client = [System.Net.Sockets.TcpClient]::new()
                $client.Connect("127.0.0.1", $port)
                $client.Dispose()
                $ready = $true
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) {
              throw "Backend did not become ready within 30 seconds."
            }
            Write-Host "Backend ready after $($startedAt.Elapsed.TotalSeconds.ToString('0.000')) s"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      # The updater compares this against the installed app's version, so a
      # forgotten manual bump here would silently break update detection
      # (not just mislabel a filename, as it did before this was added).
      - name: Sync app version with tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' frontend/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json frontend/src-tauri/tauri.conf.json

      # tauri-action runs the beforeBuildCommand (npm run build) then bundles
      # the NSIS installer + MSI and uploads them to the tag's release, along
      # with the signed latest.json the updater plugin polls.
      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Nemoris ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
