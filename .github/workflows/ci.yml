name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest          # pytest is not in requirements.txt
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend (lint + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"            # vite ^8 requires Node 20.19+/22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps  # matches the packaging scripts' peer-dep handling
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run
